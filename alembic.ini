[alembic]
# Where migration scripts live, relative to this file.
script_location = alembic

# src-layout: make `eap` importable when alembic runs standalone.
prepend_sys_path = src

# Migration filenames: 0002_add_tenants.py style (sortable, readable).
file_template = %%(rev)s_%%(slug)s

# Use OS path separator for version_locations.
version_path_separator = os

# Timezone for migration timestamps.
timezone = UTC

# DELIBERATELY EMPTY. env.py injects the URL from eap.core.config.Settings.
sqlalchemy.url =


[post_write_hooks]
# Auto-format generated migrations with ruff. Optional but keeps diffs clean.
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
