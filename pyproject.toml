[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eap"
version = "0.1.0"
description = "Enterprise AI Agent Platform — multi-tenant agent runtime (FastAPI, PostgreSQL/pgvector, Redis, LangGraph)."
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "structlog>=24.1",
  "pgvector>=0.3",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "email-validator>=2.2",
  "google-genai>=1.0.0",
  "httpx>=0.27",
  "langgraph>=1.0",
  "anthropic>=0.40",
  "temporalio>=1.9",
]

[project.optional-dependencies]
# Operator scripts (scripts/ingest_pdfs.py). Not a runtime dependency: the API never parses PDFs.
scripts = ["pypdf>=5.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5", "pypdf>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["live: real model calls on the keys in .env - opt in with --live (costs money)"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.format]
# Always LF. Without this ruff keeps each file's existing endings, so a CRLF file
# written on Windows can pass locally and fail CI on Ubuntu.
line-ending = "lf"