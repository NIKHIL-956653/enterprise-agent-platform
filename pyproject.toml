[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eap"
version = "0.1.0"
description = "Enterprise AI Agent Platform — multi-tenant agent runtime (FastAPI, PostgreSQL/pgvector, Redis, LangGraph)."
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "pydantic-settings>=2.3",
  "structlog>=24.1",
  "pgvector>=0.3",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.format]
# Always LF. Without this ruff keeps each file's existing endings, so a CRLF file
# written on Windows can pass locally and fail CI on Ubuntu.
line-ending = "lf"