services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eap
      POSTGRES_PASSWORD: eap
      POSTGRES_DB: eap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eap -d eap"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Temporal (EAP-43). auto-setup creates its own `temporal` + `temporal_visibility`
  # databases inside the SAME postgres - one instance to run, same stack in CI.
  temporal:
    image: temporalio/auto-setup:1.24.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: eap
      POSTGRES_PWD: eap
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"

  # Web UI at http://localhost:8233 - workflow history, retries, stack traces per run.
  temporal-ui:
    image: temporalio/ui:2.26.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8233:8080"

volumes:
  pgdata: