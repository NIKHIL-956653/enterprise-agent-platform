name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # GitHub starts these containers before the job and tears them down after.
    # Same images as docker-compose.yml on purpose — CI must not test a different stack.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eap
          POSTGRES_PASSWORD: eap
          POSTGRES_DB: eap
        ports:
          - 5432:5432
        # Without this, the job starts before Postgres accepts connections and tests flake.
        options: >-
          --health-cmd "pg_isready -U eap -d eap"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      temporal:
        image: temporalio/auto-setup:1.24.2
        env:
          DB: postgres12
          # auto-setup waits on `nc -z $POSTGRES_SEEDS $DB_PORT` and has no default port:
          # without this it loops on "Waiting for PostgreSQL" forever and every test that
          # needs a worker errors. docker-compose.yml always had it; CI did not (EAP-43).
          DB_PORT: 5432
          POSTGRES_USER: eap
          POSTGRES_PWD: eap
          POSTGRES_SEEDS: postgres
        ports:
          - 7233:7233

    env:
      APP_ENV: test
      LOG_LEVEL: WARNING
      # No .env in CI (it's gitignored). Point at the service containers explicitly.
      DATABASE_URL: postgresql+asyncpg://eap:eap@localhost:5432/eap
      # The app must run as the restricted role, not the table owner — owners bypass RLS,
      # so without this the tenant-isolation tests pass for the wrong reason.
      APP_DATABASE_URL: postgresql+asyncpg://eap_app:eap_app@localhost:5432/eap
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # Schema must be built by migrations, never by create_all(). If a migration is
      # broken or missing, CI fails here rather than in prod.
      - name: Migrate
        run: alembic upgrade head

      # Fails if the models and the migrated schema disagree. upgrade head only proves the
      # migrations apply; this proves they match the code.
      - name: Check for schema drift
        run: alembic check

      # The service has no health check: its port opens before auto-setup has built the
      # schema and registered the `default` namespace the test workers use. Wait for the
      # namespace itself, not the port.
      - name: Wait for Temporal
        run: |
          python - <<'EOF'
          import asyncio, time
          from temporalio.api.workflowservice.v1 import DescribeNamespaceRequest
          from temporalio.client import Client

          async def main() -> None:
              deadline = time.monotonic() + 240
              while True:
                  try:
                      client = await Client.connect("localhost:7233")
                      await client.workflow_service.describe_namespace(
                          DescribeNamespaceRequest(namespace="default")
                      )
                      print("Temporal ready")
                      return
                  except Exception as e:
                      if time.monotonic() > deadline:
                          raise SystemExit(f"Temporal not ready after 240s: {e}")
                      await asyncio.sleep(3)

          asyncio.run(main())
          EOF

      - name: Test
        run: pytest -v